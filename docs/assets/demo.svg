<text x="520" y="33" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="sans-serif">zmq-vision / local TCP / no model downloads</text>
<g font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="17"><text x="36" y="100" fill="#5eead4">$ zmq-vision demo</text>
<text x="36" y="132" fill="#dbeafe"></text>
<text x="36" y="164" fill="#dbeafe">ZMQ Vision · local TCP demo</text>
