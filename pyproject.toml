[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zmq-vision"
dynamic = ["version"]
description = "Serve image models over ZeroMQ with sync and async Python clients"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jamal Saeedi", email = "jamal.saeedi7@gmail.com" }]
keywords = ["zeromq", "inference", "computer-vision", "pytorch", "tensorflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pyzmq>=27.2,<28", "Pillow>=12.1,<14", "click>=8.3,<9"]

[project.optional-dependencies]
torch = ["torch>=2.11,<3", "torchvision>=0.26,<1", "timm>=1.0.30,<2"]
tf = ["tensorflow>=2.21,<3"]
dev = [
    "pytest>=8.4,<10", "pytest-asyncio>=1,<2", "pytest-cov>=6,<8",
    "numpy>=2.2,<3", "ruff>=0.14,<1", "build>=1.3,<2", "twine>=6,<8",
]

[project.scripts]
zmq-vision = "zmq_inference.cli.main:cli"
zmq-inference = "zmq_inference.cli.main:cli"

[project.urls]
Homepage = "https://github.com/jamal-saeedi/zmq-vision"
Repository = "https://github.com/jamal-saeedi/zmq-vision"
Issues = "https://github.com/jamal-saeedi/zmq-vision/issues"
Changelog = "https://github.com/jamal-saeedi/zmq-vision/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "zmq_inference.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"zmq_inference" = ["py.typed"]
"zmq_inference.data" = ["imagenet_classes.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["examples/legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = ["torch: optional real PyTorch model tests", "tf: optional real TensorFlow model tests"]
